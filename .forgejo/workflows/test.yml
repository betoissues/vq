# CI on the primary repository. Its presence also stops Forgejo Actions from
# falling back to .github/workflows, whose release job only works on GitHub.
name: test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: nebula-01
    # The runner's default image (alpine) has no Node, which checkout and
    # setup-go need; setup-go then installs the Go version from go.mod.
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...
